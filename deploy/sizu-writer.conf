# Example Apache configuration. HTTPS is terminated here, and gunicorn
# listens on the loopback interface only.

<VirtualHost *:443>
    ServerName sizu.example.net

    SSLEngine on
    SSLCertificateFile    /etc/ssl/certs/sizu.example.net.crt
    SSLCertificateKeyFile /etc/ssl/private/sizu.example.net.key

    ProxyPreserveHost On
    ProxyTimeout 180
    ProxyPass        / http://127.0.0.1:8090/
    ProxyPassReverse / http://127.0.0.1:8090/

    # Restrict the readers. Pick one of these, or use a VPN instead.
    # <Location />
    #     AuthType Basic
    #     AuthName "sizu-writer"
    #     AuthUserFile /etc/apache2/sizu.htpasswd
    #     Require valid-user
    # </Location>
    # <Location />
    #     Require ip 192.0.2.0/24
    # </Location>

    ErrorLog  ${APACHE_LOG_DIR}/sizu-writer_error.log
    CustomLog ${APACHE_LOG_DIR}/sizu-writer_access.log combined
</VirtualHost>
