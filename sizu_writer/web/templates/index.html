{% extends "base.html" %}

{% block content %}
<form method="post" action="{{ url_for('generate') }}">
  <label for="input_text">短文・メモ</label>
  <textarea id="input_text" name="input_text" rows="12" maxlength="{{ max_input_chars }}">{{ input_text or "" }}</textarea>
  <div class="buttons">
    <button type="submit" name="mode" value="full">生成する</button>
    <button type="button" data-clear-target="input_text">入力を消去</button>
  </div>
</form>
{% endblock %}
