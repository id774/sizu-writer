{% extends "base.html" %}

{% block content %}
<form method="post" action="{{ url_for('generate') }}">
  <input type="hidden" name="body" value="{{ body or '' }}">
  <label for="input_text">Memo</label>
  <textarea id="input_text" name="input_text" lang="ja" rows="12" maxlength="{{ max_input_chars }}">{{ input_text or "" }}</textarea>
  <div class="buttons">
    <button type="submit" name="mode" value="full">Generate once more</button>
    <a href="{{ url_for('index') }}">Back to the input screen</a>
  </div>
</form>
{% endblock %}
