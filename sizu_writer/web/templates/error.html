{% extends "base.html" %}

{% block content %}
<form method="post" action="{{ url_for('generate') }}">
  <input type="hidden" name="body" value="{{ body or '' }}">
  <label for="input_text">短文・メモ</label>
  <textarea id="input_text" name="input_text" rows="12" maxlength="{{ max_input_chars }}">{{ input_text or "" }}</textarea>
  <div class="buttons">
    <button type="submit" name="mode" value="full">もう一度生成する</button>
    <a href="{{ url_for('index') }}">入力画面へ戻る</a>
  </div>
</form>
{% endblock %}
